<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 380" width="100%" height="100%">
  <defs>
    <style>
      .title { font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 14px; font-weight: 700; fill: #1e293b; }
      .box-hdr { font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 12px; font-weight: 600; fill: #0f172a; text-anchor: middle; }
      .text-msg { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; font-size: 11px; fill: #334155; }
      .text-sub { font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 10px; fill: #64748b; }
      .lifeline { stroke: #cbd5e1; stroke-width: 1.5; stroke-dasharray: 4 4; }
      .arrow { stroke: #4f46e5; stroke-width: 1.75; marker-end: url(#arrowhead); }
      .return-arrow { stroke: #10b981; stroke-width: 1.75; stroke-dasharray: 4 3; marker-end: url(#arrowhead-green); }
      .note-box { fill: #f8fafc; stroke: #e2e8f0; stroke-width: 1; rx: 6; }
    </style>
    <marker id="arrowhead" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#4f46e5"/>
    </marker>
    <marker id="arrowhead-green" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#10b981"/>
    </marker>
  </defs>

  <rect width="100%" height="100%" fill="#ffffff" rx="12"/>
  <rect x="1" y="1" width="758" height="378" fill="none" stroke="#e2e8f0" stroke-width="1.5" rx="12"/>
  <text x="24" y="32" class="title">Sequence: Pandas Size-Controlled Baseline &amp; Anomaly Detection</text>

  <!-- Participants -->
  <rect x="40" y="55" width="130" height="36" rx="6" fill="#e0e7ff" stroke="#6366f1" stroke-width="1.5"/>
  <text x="105" y="78" class="box-hdr">FastAPI Router</text>
  <line x1="105" y1="91" x2="105" y2="340" class="lifeline"/>

  <rect x="315" y="55" width="130" height="36" rx="6" fill="#ede9fe" stroke="#8b5cf6" stroke-width="1.5"/>
  <text x="380" y="78" class="box-hdr">Pandas Pipeline</text>
  <line x1="380" y1="91" x2="380" y2="340" class="lifeline"/>

  <rect x="590" y="55" width="130" height="36" rx="6" fill="#fce7f3" stroke="#ec4899" stroke-width="1.5"/>
  <text x="655" y="78" class="box-hdr">Statistical Engine</text>
  <line x1="655" y1="91" x2="655" y2="340" class="lifeline"/>

  <!-- Messages -->
  <!-- 1. Send raw data -->
  <line x1="105" y1="120" x2="372" y2="120" class="arrow"/>
  <text x="120" y="114" class="text-msg">1. process_and_audit(raw_prs_json)</text>

  <!-- 2. Self Pandas Cleaning -->
  <rect x="380" y="135" width="180" height="52" class="note-box"/>
  <text x="390" y="152" class="text-msg">2. Drop unmerged PRs</text>
  <text x="390" y="167" class="text-sub">review_time = (merged - created)</text>
  <text x="390" y="180" class="text-sub">Group: Small (&lt;250), Med, Large</text>

  <!-- 3. Forward to statistical engine -->
  <line x1="380" y1="210" x2="647" y2="210" class="arrow"/>
  <text x="400" y="204" class="text-msg">3. compute_baselines(merged_df)</text>

  <!-- 4. Self Statistical Model -->
  <rect x="575" y="225" width="160" height="48" class="note-box"/>
  <text x="585" y="242" class="text-msg">4. Medians &amp; 90% CI</text>
  <text x="585" y="258" class="text-sub">Flag if review &gt; 1.5 * median</text>

  <!-- 5. Return Anomaly Matrix -->
  <line x1="647" y1="290" x2="388" y2="290" class="return-arrow"/>
  <text x="420" y="284" class="text-msg">5. Return anomalies + medians</text>

  <!-- 6. Return response to API -->
  <line x1="372" y1="320" x2="113" y2="320" class="return-arrow"/>
  <text x="135" y="314" class="text-msg">6. JSON Audit Response Payload</text>
</svg>
