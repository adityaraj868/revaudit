<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 380" width="100%" height="100%">
  <defs>
    <style>
      .title { font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 14px; font-weight: 700; fill: #1e293b; }
      .box-hdr { font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 12px; font-weight: 600; fill: #0f172a; text-anchor: middle; }
      .text-msg { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; font-size: 11px; fill: #334155; }
      .text-sub { font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 10px; fill: #64748b; }
      .lifeline { stroke: #cbd5e1; stroke-width: 1.5; stroke-dasharray: 4 4; }
      .arrow { stroke: #0284c7; stroke-width: 1.75; marker-end: url(#arrowhead-blue); }
      .return-arrow { stroke: #059669; stroke-width: 1.75; stroke-dasharray: 4 3; marker-end: url(#arrowhead-emerald); }
      .note-box { fill: #f0fdf4; stroke: #bbf7d0; stroke-width: 1; rx: 6; }
    </style>
    <marker id="arrowhead-blue" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#0284c7"/>
    </marker>
    <marker id="arrowhead-emerald" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#059669"/>
    </marker>
  </defs>

  <rect width="100%" height="100%" fill="#ffffff" rx="12"/>
  <rect x="1" y="1" width="758" height="378" fill="none" stroke="#e2e8f0" stroke-width="1.5" rx="12"/>
  <text x="24" y="32" class="title">Sequence: Backend Fetching &amp; Paginating GitHub API</text>

  <!-- Participants -->
  <rect x="50" y="55" width="160" height="36" rx="6" fill="#e0e7ff" stroke="#6366f1" stroke-width="1.5"/>
  <text x="130" y="78" class="box-hdr">FastAPI Service</text>
  <line x1="130" y1="91" x2="130" y2="340" class="lifeline"/>

  <rect x="290" y="55" width="160" height="36" rx="6" fill="#e0f2fe" stroke="#38bdf8" stroke-width="1.5"/>
  <text x="370" y="78" class="box-hdr">Requests HTTP Client</text>
  <line x1="370" y1="91" x2="370" y2="340" class="lifeline"/>

  <rect x="530" y="55" width="175" height="36" rx="6" fill="#dcfce7" stroke="#4ade80" stroke-width="1.5"/>
  <text x="617" y="78" class="box-hdr">GitHub REST API v3</text>
  <line x1="617" y1="91" x2="617" y2="340" class="lifeline"/>

  <!-- Messages -->
  <line x1="130" y1="125" x2="362" y2="125" class="arrow"/>
  <text x="145" y="118" class="text-msg">1. get_pull_requests(owner, repo, limit=30)</text>

  <line x1="370" y1="160" x2="609" y2="160" class="arrow"/>
  <text x="385" y="153" class="text-msg">2. GET /repos/{owner}/{repo}/pulls?state=closed</text>

  <line x1="609" y1="200" x2="378" y2="200" class="return-arrow"/>
  <text x="400" y="193" class="text-msg">3. 200 OK (30 PR JSON items + Link Header)</text>

  <rect x="370" y="218" width="190" height="38" class="note-box"/>
  <text x="380" y="235" class="text-msg">Check rate limits (X-RateLimit)</text>
  <text x="380" y="248" class="text-sub">Validate JSON structure &amp; timestamps</text>

  <line x1="362" y1="285" x2="138" y2="285" class="return-arrow"/>
  <text x="155" y="278" class="text-msg">4. Return raw PR payload</text>

  <rect x="130" y="298" width="200" height="34" class="note-box"/>
  <text x="140" y="315" class="text-msg">Hand off to Pandas Engine</text>
  <text x="140" y="327" class="text-sub">Impute unmerged PRs &amp; group</text>
</svg>
